[package]
name = "consumer-service"
version = "0.1.0"
edition = "2024"

[dependencies]
shared = { path = "../../libs/shared" }
tokio = { version = "1.52.3", features = ["macros", "rt-multi-thread", "time", "signal"] }
sqlx = { version = "0.9.0", features = ["chrono", "postgres", "runtime-tokio", "uuid"] }
redis = { version = "1.2.2", features = ["tokio-comp", "connection-manager"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1"
uuid = { version = "1.23.2", features = ["serde", "v4"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
lapin = "2.5.0"

# OpenTelemetry
opentelemetry = { version = "0.32", features = ["trace"] }
tracing-opentelemetry = "0.33"
deadpool-lapin = "0.12.1"
futures-lite = "2.6.0"
dotenvy = "0.15.7"
