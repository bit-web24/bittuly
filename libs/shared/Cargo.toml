[package]
name = "shared"
version = "0.1.0"
edition = "2024"

[dependencies]
jsonwebtoken = { version = "10.4.0", features = ["rust_crypto"] }
serde = { version = "1.0.228", features = ["derive"] }
dotenvy = "0.15.7"
uuid = { version = "1.23.2", features = ["serde", "v4"] }
axum = "0.8.9"
sqlx = { version = "0.9.0", features = ["chrono", "postgres", "runtime-tokio", "uuid"] }
redis = { version = "1.2.2", features = ["tokio-comp", "connection-manager"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tokio = { version = "1.52.3", features = ["macros", "rt-multi-thread"] }
lapin = "2.5.0"
deadpool-lapin = "0.12.1"
metrics = "0.24"

# OpenTelemetry Tracing
opentelemetry = { version = "0.32", features = ["trace"] }
opentelemetry_sdk = { version = "0.32", features = ["rt-tokio", "trace"] }
opentelemetry-otlp = { version = "0.32", features = ["grpc-tonic", "trace"] }
opentelemetry-semantic-conventions = { version = "0.32", features = ["semconv_experimental"] }
tracing-opentelemetry = "0.33"
