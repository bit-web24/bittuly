worker_processes auto;
worker_rlimit_nofile 200000;

events {
    worker_connections 50000;
    use epoll;
    multi_accept on;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;

    # ---------------------------------------------------------------------------
    # Rate Limiting Zones
    # ---------------------------------------------------------------------------
    # General zone: for short-URL redirects
    limit_req_zone $binary_remote_addr zone=redirect_limit:200m rate=20r/s;
    # Strict zone: for auth endpoints (login, signup) to prevent brute force
    limit_req_zone $binary_remote_addr zone=auth_limit:50m rate=5r/m;
    limit_req_status 429;

    # ---------------------------------------------------------------------------
    # Proxy Timeouts (prevent slow-loris and backend-overload hanging connections)
    # ---------------------------------------------------------------------------
    proxy_connect_timeout 5s;
    proxy_send_timeout    30s;
    proxy_read_timeout    30s;

    server {
        listen 8000;
        server_name localhost;

        # ---------------------------------------------------------------------------
        # Security Headers
        # ---------------------------------------------------------------------------
        add_header X-Frame-Options          "DENY"                              always;
        add_header X-Content-Type-Options   "nosniff"                           always;
        add_header X-XSS-Protection         "1; mode=block"                     always;
        add_header Referrer-Policy          "strict-origin-when-cross-origin"   always;
        add_header Permissions-Policy       "camera=(), microphone=(), geolocation=()" always;
        # CSP — tighten for your production domain before going live
        add_header Content-Security-Policy  "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' ws://localhost:5173;" always;
        # NOTE: Uncomment the HSTS header once TLS is configured at the gateway.
        # add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

        # Forward actual IP and Protocol headers
        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $scheme;

        # -----------------------------------------
        # 1. API Routes
        # -----------------------------------------

        # Block external access to internal metrics endpoints
        location ~ ^/api/.*/metrics$ {
            return 403;
        }

        # Auth endpoints — strict rate limit to prevent brute-force attacks
        location /api/auth/login {
            limit_req zone=auth_limit burst=5 nodelay;
            proxy_pass http://127.0.0.1:3001;
        }

        location /api/auth/signup {
            limit_req zone=auth_limit burst=5 nodelay;
            proxy_pass http://127.0.0.1:3001;
        }

        location /api/auth {
            proxy_pass http://127.0.0.1:3001;
        }

        location /api/urls {
            proxy_pass http://127.0.0.1:3002;
        }

        # -----------------------------------------
        # 2. Frontend SPA (Vite)
        # -----------------------------------------
        # Exact root goes to Frontend
        location = / {
            proxy_pass http://127.0.0.1:5173;
        }

        # Known frontend routes and assets
        location ~ ^/(dashboard|login|signup|verify-otp|profile|settings|insights|health|unavailable|assets|src|node_modules|@fs|@vite|@react-refresh|__vite_ping|favicon.ico|manifest.json) {
            proxy_pass http://127.0.0.1:5173;

            # WebSocket support for Vite HMR
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # -----------------------------------------
        # 3. Short URLs (Catch-all)
        # -----------------------------------------
        # Any path that isn't an API or known Frontend route is assumed
        # to be a short code and goes to the URL service.
        location / {
            # Apply rate limiting: allow bursts up to 20 requests without artificial delay
            limit_req zone=redirect_limit burst=20 nodelay;
            proxy_pass http://127.0.0.1:3002;

            # Intercept 404 (Not Found) and 410 (Gone) from the backend
            proxy_intercept_errors on;
            error_page 404 410 =200 @frontend;
        }

        # Interception fallback to render the React app at the current URL
        location @frontend {
            proxy_pass http://127.0.0.1:5173;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
