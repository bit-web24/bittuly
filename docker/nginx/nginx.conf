worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;

    # Rate limiting zone for IP addresses
    # 100MB memory can efficiently track ~1.6 million unique IP addresses simultaneously
    limit_req_zone $binary_remote_addr zone=ip_limit:200m rate=20r/s;
    limit_req_status 429; # Return 429 Too Many Requests instead of default 503

    server {
        listen 8000;
        server_name localhost;

        # Forward actual IP and Protocol headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # -----------------------------------------
        # 1. API Routes
        # -----------------------------------------
        location /api/auth {
            proxy_pass http://127.0.0.1:3001;
        }

        location /api/urls {
            proxy_pass http://127.0.0.1:3002;
        }

        # -----------------------------------------
        # 2. Frontend SPA (Vite)
        # -----------------------------------------
        # Exact root goes to Frontend
        location = / {
            proxy_pass http://127.0.0.1:5173;
        }

        # Known frontend routes and assets
        location ~ ^/(dashboard|login|signup|verify-otp|profile|settings|insights|health|unavailable|assets|src|node_modules|@fs|@vite|@react-refresh|__vite_ping|favicon.ico|manifest.json) {
            proxy_pass http://127.0.0.1:5173;

            # WebSocket support for Vite HMR
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # -----------------------------------------
        # 3. Short URLs (Catch-all)
        # -----------------------------------------
        # Any path that isn't an API or known Frontend route is assumed
        # to be a short code and goes to the URL service.
        location / {
            # Apply rate limiting: allow bursts up to 20 requests without artificial delay
            limit_req zone=ip_limit burst=20 nodelay;
            proxy_pass http://127.0.0.1:3002;
            
            # Intercept 404 (Not Found) and 410 (Gone) from the backend
            proxy_intercept_errors on;
            error_page 404 410 =200 @frontend;
        }

        # Interception fallback to render the React app at the current URL
        location @frontend {
            proxy_pass http://127.0.0.1:5173;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
