server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    location / {
        # Try to serve static files first
        try_files $uri @backend;
    }

    location @backend {
        # If the file isn't found (e.g. /login or /some-short-code), 
        # proxy it to the url-service to check if it's a short URL
        proxy_pass http://url-service.bittuly.svc.cluster.local:3002;
        
        # If url-service returns 404 (meaning it's a React route like /login, not a short URL),
        # intercept the error and serve the React index.html instead!
        proxy_intercept_errors on;
        error_page 404 410 =200 /index.html;
    }
}
