apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: bittuly
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
        - name: auth-service
          image: bittuly/auth-service:local
          imagePullPolicy: Never   # use locally loaded image — no registry needed
          ports:
            - containerPort: 3001
          envFrom:
            - configMapRef:
                name: bittuly-config
          env:
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: bittuly-secrets
                  key: JWT_SECRET
            - name: SMTP_USER
              valueFrom:
                secretKeyRef:
                  name: bittuly-secrets
                  key: SMTP_USER
            - name: SMTP_PASS
              valueFrom:
                secretKeyRef:
                  name: bittuly-secrets
                  key: SMTP_PASS
          livenessProbe:
            httpGet:
              path: /api/auth/health
              port: 3001
            initialDelaySeconds: 10
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/auth/health
              port: 3001
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 2
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: bittuly
spec:
  selector:
    app: auth-service
  ports:
    - port: 3001
      targetPort: 3001
