apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-auth-pvc
  namespace: bittuly
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-auth
  namespace: bittuly
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres-auth
  template:
    metadata:
      labels:
        app: postgres-auth
    spec:
      containers:
        - name: postgres-auth
          image: postgres:17-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: bittuly_auth
            - name: POSTGRES_USER
              value: bittu
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: bittuly-secrets
                  key: POSTGRES_AUTH_PASSWORD
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: init-scripts
              mountPath: /docker-entrypoint-initdb.d
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "bittu", "-d", "bittuly_auth"]
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: postgres-auth-pvc
        - name: init-scripts
          configMap:
            name: postgres-auth-init
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-auth
  namespace: bittuly
spec:
  selector:
    app: postgres-auth
  ports:
    - port: 5432
      targetPort: 5432
